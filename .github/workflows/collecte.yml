name: Collecte JeuxDeMots
on:
  push:
    paths: ['collecte/**', '.github/workflows/collecte.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: collecte, cancel-in-progress: false }
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Déjà terminé ?
        id: fini
        run: if [ -f resultats/TERMINE ]; then echo "oui=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.fini.outputs.oui != '1'
        with: { python-version: '3.12' }
      - name: Collecter
        if: steps.fini.outputs.oui != '1'
        run: python collecte/collecte.py
      - name: Enregistrer
        if: always() && steps.fini.outputs.oui != '1'
        run: |
          git config user.name "collecte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resultats
          git commit -m "Collecte : $(cat resultats/etat.json 2>/dev/null | tr -d '\n ')" || echo "Rien à enregistrer"
          git pull --rebase && git push
