name: Enrichissements (Wikipédia, Ngram, normes)
on:
  push:
    paths: ['collecte/wikipedia.py', 'collecte/ngram.py', 'collecte/normes.py', 'collecte/commun.py', '.github/workflows/enrichissements.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        script: [normes, ngram, wikipedia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: cd collecte && cp commun.py /tmp/ && cd .. && PYTHONPATH=collecte python collecte/${{ matrix.script }}.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "collecte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resultats_${{ matrix.script }} || true
          git commit -m "Enrichissement ${{ matrix.script }} : $(cat resultats_${{ matrix.script }}/etat.json 2>/dev/null | tr -d '\n ' | head -c 300)" || echo "Rien à enregistrer"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done
