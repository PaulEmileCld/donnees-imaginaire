name: Repérage 2 JeuxDeMots
on:
  push:
    paths: ['.github/workflows/reperage2.yml', 'collecte/reperage2.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reperage2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python collecte/reperage2.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "collecte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reperage2
          git commit -m "Repérage 2 : types de relations, essai API, correspondances" || echo "Rien à enregistrer"
          git pull --rebase && git push
