name: Collecte ConceptNet
on:
  push:
    paths: ['collecte/conceptnet.py', '.github/workflows/conceptnet.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: conceptnet, cancel-in-progress: true }
jobs:
  conceptnet:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python collecte/conceptnet.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "collecte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resultats_conceptnet
          git commit -m "ConceptNet : $(cat resultats_conceptnet/etat.json 2>/dev/null | tr -d '\n ')" || echo "Rien à enregistrer"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
