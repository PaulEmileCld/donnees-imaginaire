name: Enrichir la suite de la liste (mots 10 001 à 30 000)
on:
  push:
    paths: ['collecte/mots_usage_suite.txt', '.github/workflows/usage_suite.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrichir:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        script: [ngram, wikipedia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: PYTHONPATH=collecte LISTE=collecte/mots_usage_suite.txt SORTIE=resultats_usage_${{ matrix.script }}_suite MENSUEL=1 python collecte/${{ matrix.script }}.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "collecte-bot"; git config user.email "actions@users.noreply.github.com"
          git add resultats_usage_${{ matrix.script }}_suite || true
          git commit -m "Suite ${{ matrix.script }} : $(cat resultats_usage_${{ matrix.script }}_suite/etat.json 2>/dev/null | tr -d '\n ' | head -c 200)" || echo "Rien"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 17; done
